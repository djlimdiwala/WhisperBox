name: Keep Render Awake

on:
  schedule:
    - cron: "0,10,20,30,40,50 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Render
        run: |
          curl --retry 5 \
               --retry-delay 10 \
               --retry-all-errors \
               https://whisperbox-7yjj.onrender.com/actuator/health